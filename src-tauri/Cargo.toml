[package]
name = "heic-converter"
version = "0.4.2"
description = "HEIC 图片转换工具。\n一款基于 Tauri 2 和 Vue 3 构建的轻量级跨平台 HEIC 图片转换工具。它可以将 HEIC/HEIF 格式的高清图片快速转换为通用的 JPG 或 PNG 格式。"
authors = ["hotime <xiaoyqde@126.com>"]
license = "GPL-3.0"
edition = "2021"
default-run = "heic-converter"

[lib]
name = "heic_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
libheif-rs = { version = "2.5", default-features = false, features = ["v1_18"] }
thiserror = "2"
tauri-plugin-log = "2"
tracing = "0.1"
rayon = "1"
turbojpeg = { version = "1.4", features = ["image"] }
mimalloc = { version = "0.1", features = ["v3"] }
chrono = "0.4"
notify-rust = "4"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
turbojpeg-sys = { version = "1.1", default-features = false, features = ["cmake", "require-simd"] }

# deb 打包由 cargo-deb 承担（tauri build 只产二进制，见 package.json 的 deb:*）。
# 构建: pnpm tauri build 后运行 `cargo deb --no-build --variant=<name>`
#  - dsg:    UOS/DSG 规范，仅 /opt/apps/${appid}/ 布局（info + entries/applications + entries/icons + files/bin）
#  - debian: 标准 Debian 布局（/usr/bin + /usr/share/applications + /usr/share/icons）
# assets 自定义后完全替换 cargo-deb 默认行为（binary→/usr/bin、readme→usr/share/doc），
# 因此两个变体互不残留。
[package.metadata.deb]
name = "heic-converter"
# 我们即上游软件包（非 Debian 打包方），无 Debian 修订号概念，去掉默认追加的 "-1"。
revision = "0"
maintainer = "hotime <xiaoyqde@126.com>"
copyright = "2024-2026, hotime"
license-file = "../LICENSE"
# $auto：cargo-deb 3.8+ 用 dpkg-shlibdeps 自动解析二进制的直接依赖（GTK/WebKit 栈、
# libheif1 等，带正确版本下限）。
# libheif1 的下限交给 $auto，不要手写：libheif1 不做符号版本化（无 verdef 节，全部符号
# 挂 @Base），dpkg-shlibdeps 改为逐符号查 libheif1:amd64.symbols 取引入版本的最大值。
# 实测本二进制用到的 20 个 heif_* 符号最高为 heif_init/heif_deinit（1.13.0 引入），故
# $auto 给出的 1.13.0 就是真实下限。libheif-rs 的 v1_18 只是编译期 FFI gate，不构成
# 运行时依赖；手写 1.18 反而会与 $auto 产出重复（同包名两条 Depends）。
# 不再手写 libde265-0/libx265-199：libde265 经 libheif1 传递保证，x265 根本不在链接树（只转 JPG/PNG）。
# libayatana-appindicator3-1：托盘库。libappindicator-sys 0.9 是纯 dlopen（无 build.rs、
# 不在 NEEDED 里），dpkg-shlibdeps 看不到，必须手写，否则装完托盘图标不显示。
depends = "$auto, libayatana-appindicator3-1"
# changelog 不用 [metadata.deb] 的 changelog 字段：那条路径（config.rs:790
# add_changelog_asset）把文件名写死成 changelog.Debian.gz，语义是「Debian 打包侧
# 维护的 changelog」，用于与上游 changelog 并存的双文件场景。
# 我们自己就是上游，只有一份 changelog，双文件场景不成立，故改走 assets 声明
# usr/share/doc/<包名>/changelog —— cargo-deb 的 compressed_assets()
# （assets.rs:569，needs_compression 命中 usr/share/doc/*/changelog）会自动 gzip，
# 最终得到 changelog.gz，与 dpkg-buildpackage（dh_installchangelogs，无上游
# changelog 时装成 changelog.gz）的结果一致。
# 注意 DSG 变体的 usr 路径同样由 fixup-dsg-deb.sh 重排到 entries/doc/<appid>/。
section = "graphics"
priority = "optional"

[package.metadata.deb.variants.dsg]
# DSG 规范：全部应用文件位于 /opt/apps/top.hotime.heic-converter/。
# 包名直接使用反转域名 appid；与 debian 变体包名不同，互不覆盖。
name = "top.hotime.heic-converter"
assets = [
  ["info", "opt/apps/top.hotime.heic-converter/info", "644"],
  ["heic-converter-dsg.desktop", "opt/apps/top.hotime.heic-converter/entries/applications/top.hotime.heic-converter.desktop", "644"],
  # DSG 支持 SVG 图标：直接打包源文件，无需按尺寸生成多档 PNG。
  ["../src/assets/app-icon.svg", "opt/apps/top.hotime.heic-converter/entries/icons/hicolor/scalable/apps/top.hotime.heic-converter.svg", "644"],
  # DSG 应用在 /opt/apps/{appid}/ 内无命名冲突，二进制用应用名 heic-converter。
  ["target/release/heic-converter", "opt/apps/top.hotime.heic-converter/files/bin/", "755"],
  # changelog 走 usr/share/doc 路径声明（而非直接指向 entries/doc/），有两个原因：
  #   1) 只有 usr/ 开头的路径才会命中 compressed_assets() 的自动 gzip；
  #   2) 放在 usr/share/doc/ 与 copyright 的生成位置一致，由 fixup-dsg-deb.sh
  #      统一搬到 entries/doc/，和 copyright 保持同一套搬运逻辑。
  # 目标文件名写 changelog（不带 .gz），cargo-deb 压缩后成为 changelog.gz。
  ["../debian/changelog", "usr/share/doc/top.hotime.heic-converter/changelog", "644"],
]

[package.metadata.deb.variants.debian]
# 标准 Debian 布局：/usr/bin 二进制 + 桌面入口 + 图标，非 UOS 平台安装后可直接进菜单。
# 包名沿用基础包名 heic-converter（与 dsg 变体的反转域名包名区分，避免 deb 包互相覆盖）。
name = "heic-converter"
assets = [
  # 包名即 heic-converter，二进制同名。
  ["target/release/heic-converter", "usr/bin/", "755"],
  ["heic-converter-debian.desktop", "usr/share/applications/heic-converter.desktop", "644"],
  # 图标与 dsg 变体共用同一份源文件（scalable SVG）。
  ["../src/assets/app-icon.svg", "usr/share/icons/hicolor/scalable/apps/heic-converter.svg", "644"],
  # changelog：目标路径不带 .gz，cargo-deb 自动压缩成 changelog.gz（见基础段说明）。
  ["../debian/changelog", "usr/share/doc/heic-converter/changelog", "644"],
]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
incremental = false
strip = true  # 减小二进制文件大小

[profile.release.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3.10"
rstest = "0.21"
