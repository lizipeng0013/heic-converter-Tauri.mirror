[package]
name = "heic-converter"
version = "0.3.0"
description = "一款基于 Tauri 2 和 Vue 3 构建的轻量级跨平台 HEIC 图片转换工具。它可以将 HEIC/HEIF 格式的高清图片快速转换为通用的 JPG 或 PNG 格式。"
authors = ["hotime"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "heic_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.5.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-shell = "2.3.4"
image = { version = "0.25.9", features = ["jpeg", "png", "webp"] }
libheif-rs = { version = "2.5.2", default-features = false, features = ["v1_18"] }
thiserror = "2.0.17"
tauri-plugin-log = "2.8.0"
tracing = "0.1"
rayon = "1.10"

[profile.release]
# 启用链接时优化 (LTO)，可以跨模块优化代码
lto = "fat"
# 启用代码生成单元化，减少函数调用开销
codegen-units = 1
# 最高优化级别
opt-level = 3
# 在链接时丢弃未使用的代码
panic = "abort"
# 启用增量编译（开发时有用，release 时可以关闭以获得更好的优化）
incremental = false
# 启用调试符号（可选，如果需要调试 release 版本）
# debug = true

# 启用额外的优化选项
[profile.release.package."*"]
opt-level = 3
